name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node scripts/gen-schema.mjs --check
      - name: Example verify (expected to report an unproven claim)
        run: |
          set +e
          node dist/cli.js verify examples/tiny-calc
          code=$?
          set -e
          test "$code" -eq 1
      - run: npm pack --dry-run

  npx-from-git:
    name: npx install from git checkout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install this checkout the way npx github:owner/repo does
        run: |
          mkdir -p /tmp/consumer && cd /tmp/consumer
          npm init -y >/dev/null
          npm install "git+file://$GITHUB_WORKSPACE"
          npx proofrail --version
          npx proofrail validate "$GITHUB_WORKSPACE/examples/tiny-calc"
